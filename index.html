<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SUNNYVALE 3D | 초호화 3D 디오라마 목장 시뮬레이션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Three.js & Post-Processing Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-app">
    <!-- 3D WebGL Canvas -->
    <div id="webgl-container"></div>

    <!-- Cinematic Post-Processing Vignette -->
    <div id="cinematic-vignette"></div>

    <!-- ================= VISION-OS STYLE GLASS TOP HUD ================= -->
    <header id="vision-top-hud">
      <div class="glass-pill left-pill">
        <div class="sun-orb" id="hud-time-orb">☀️</div>
        <div class="time-details">
          <span class="season-badge" id="hud-season">SPRING · DAY 1</span>
          <span class="clock-badge" id="hud-clock">09:00 AM</span>
        </div>
      </div>

      <div class="glass-pill center-pill">
        <div class="farm-title">SUNNYVALE 3D DIORAMA</div>
      </div>

      <div class="glass-pill right-pill">
        <div class="gold-box">
          <span class="gold-sparkle">🪙</span>
          <span id="hud-gold-val">1,200 G</span>
        </div>
        <div class="energy-box">
          <div class="energy-fill" id="hud-energy-bar" style="width: 100%;"></div>
          <span class="energy-text" id="hud-energy-val">⚡ 100/100</span>
        </div>
      </div>
    </header>

    <!-- ================= 3D TARGET HIGHLIGHT & INTERACTION RETICLE ================= -->
    <div id="interaction-reticle" class="hidden">
      <div class="reticle-ring"></div>
      <div class="reticle-label" id="reticle-text">작물 수확</div>
    </div>

    <!-- ================= 3D CAMERA CONTROLS GUIDE ================= -->
    <div id="camera-hint">
      <span>👆 드래그: 3D 회전 | 🤏 핀치/휠: 줌인·아웃 | 🎯 터치: 농경 작업</span>
    </div>

    <!-- ================= FLOATING GLASS ACTION BUTTONS ================= -->
    <div id="vision-floating-dock">
      <button id="btn-open-shop" class="glass-btn" title="상점">
        <span class="g-icon">🛍️</span>
        <span class="g-label">상점</span>
      </button>
      <button id="btn-open-bag" class="glass-btn" title="인벤토리">
        <span class="g-icon">🎒</span>
        <span class="g-label">배낭</span>
      </button>
      <button id="btn-toggle-time" class="glass-btn" title="낮/노을/밤 전환">
        <span class="g-icon">🌅</span>
        <span class="g-label">조명</span>
      </button>
      <button id="btn-sleep" class="glass-btn btn-highlight" title="하루 끝내기">
        <span class="g-icon">🌙</span>
        <span class="g-label">취침</span>
      </button>
    </div>

    <!-- ================= BOTTOM TOUCH 3D TOOLBAR ================= -->
    <footer id="vision-bottom-hotbar">
      <div class="hotbar-glass-container" id="hotbar-dock">
        <!-- 3D Tool slots -->
      </div>
    </footer>

    <!-- ================= MODAL: LUXURY GLASS SHOP ================= -->
    <div id="modal-shop" class="glass-modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-card shop-card">
        <div class="modal-header">
          <div class="header-left">
            <h2>PIERRE'S LUXURY BOTANICAL</h2>
            <p>초호화 희귀 종자 및 3D 목장 조경 시설</p>
          </div>
          <button class="btn-close-modal" data-modal="modal-shop">✕</button>
        </div>

        <div class="shop-grid-scroll" id="shop-items-container">
          <!-- Dynamically populated luxury shop items -->
        </div>
      </div>
    </div>

    <!-- ================= MODAL: LUXURY GLASS INVENTORY ================= -->
    <div id="modal-bag" class="glass-modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-card bag-card">
        <div class="modal-header">
          <div class="header-left">
            <h2>MY BACKPACK & HARVEST</h2>
            <p>수확한 고품질 3D 농산물 및 자원</p>
          </div>
          <button class="btn-close-modal" data-modal="modal-bag">✕</button>
        </div>

        <div class="bag-grid-scroll" id="bag-items-container">
          <!-- 24 items slots -->
        </div>

        <div class="bag-bottom-actions">
          <span id="bag-selected-desc">아이템을 선택해 주세요.</span>
          <button id="btn-ship-selected" class="btn-luxury-gold">출하 상자에 판매</button>
        </div>
      </div>
    </div>

    <!-- Floating 3D Gold / XP Popups -->
    <div id="toast-pill" class="toast-hidden">알림</div>

  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/three-app.js"></script>
</body>
</html>
