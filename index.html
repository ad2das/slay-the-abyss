<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SUNNYVALE MEADOW | 햇살 계곡의 목장 (Cozy Farm Sim)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    
    <!-- Game Canvas Viewport -->
    <canvas id="farmCanvas"></canvas>

    <!-- Dynamic Atmosphere & Lighting Layer -->
    <div id="ambient-overlay"></div>
    <div id="fireflies-overlay"></div>

    <!-- ================= TOP HUD: TIME, DATE, WEATHER, MONEY ================= -->
    <header id="top-hud">
      <!-- Left: Day, Season & Time -->
      <div class="hud-card time-card">
        <div class="time-weather-row">
          <div class="weather-badge" id="hud-weather-icon" title="맑음">☀️</div>
          <div class="season-text" id="hud-season-text">봄 (Spring) - 1일차</div>
        </div>
        <div class="clock-display">
          <span id="hud-clock-text">08:00 AM</span>
          <div class="time-progress-bar">
            <div id="hud-time-fill" class="time-progress-fill" style="width: 25%;"></div>
          </div>
        </div>
      </div>

      <!-- Right: Energy Bar & Gold -->
      <div class="hud-card stats-card">
        <div class="money-badge">
          <span class="coin-icon">🪙</span>
          <span id="hud-gold-text">500 G</span>
        </div>
        <div class="energy-bar-wrapper">
          <div class="energy-label-row">
            <span>체력 (Energy)</span>
            <span id="hud-energy-text">100 / 100</span>
          </div>
          <div class="energy-bar-bg">
            <div id="hud-energy-fill" class="energy-bar-fill" style="width: 100%;"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= FLOATING ACTION CONTROLS & ZOOM ================= -->
    <div id="floating-actions">
      <button id="btn-open-shop" class="btn-float btn-shop" title="피에르의 만물상점">
        <span class="btn-float-icon">🏡</span>
        <span class="btn-float-label">상점</span>
      </button>
      <button id="btn-open-inventory" class="btn-float btn-bag" title="가방 / 인벤토리">
        <span class="btn-float-icon">🎒</span>
        <span class="btn-float-label">가방</span>
      </button>
      <button id="btn-sleep-bed" class="btn-float btn-sleep" title="하루 끝내기 & 취침">
        <span class="btn-float-icon">🌙</span>
        <span class="btn-float-label">취침</span>
      </button>
      <button id="btn-zoom-toggle" class="btn-float btn-zoom" title="화면 확대/축소">
        <span class="btn-float-icon">🔍</span>
      </button>
    </div>

    <!-- ================= MOBILE VIRTUAL JOYSTICK ================= -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>

    <!-- ================= BOTTOM TOOLBAR / HOTBAR ================= -->
    <footer id="bottom-hotbar-dock">
      <div class="hotbar-scroll-wrapper">
        <div class="hotbar-slots-row" id="hotbar-slots">
          <!-- 8 Mobile Touch Slots: Hoe, Can, Seeds, Basket, Feed, Rod, etc. -->
        </div>
      </div>
      <div class="hotbar-active-tip" id="hotbar-tool-name">호미 (Hoe) : 땅을 일굽니다</div>
    </footer>

    <!-- ================= MODAL: PIERRE'S COZY SHOP ================= -->
    <div id="modal-shop" class="bottom-sheet-modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="shopkeeper-profile">
            <div class="npc-avatar">👨‍🌾</div>
            <div class="npc-info">
              <h2>피에르의 시골 잡화점</h2>
              <p>"신선한 씨앗과 목장 용품이 가득하답니다!"</p>
            </div>
          </div>
          <button class="btn-close-sheet" data-modal="modal-shop">✕</button>
        </div>

        <div class="shop-tabs-nav">
          <button class="shop-tab active" data-tab="seeds">🌱 씨앗 (Seeds)</button>
          <button class="shop-tab" data-tab="animals">🐮 가축 & 사료</button>
          <button class="shop-tab" data-tab="upgrades">🔨 목장 시설 확장</button>
        </div>

        <div class="shop-goods-grid" id="shop-goods-container">
          <!-- Dynamically populated shop items -->
        </div>
      </div>
    </div>

    <!-- ================= MODAL: INVENTORY / BACKPACK ================= -->
    <div id="modal-inventory" class="bottom-sheet-modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2>내 배낭 (INVENTORY)</h2>
          <button class="btn-close-sheet" data-modal="modal-inventory">✕</button>
        </div>
        <div class="inventory-grid" id="inventory-slots-container">
          <!-- 24 Inventory Grid Slots -->
        </div>
        <div class="inventory-actions-row">
          <div class="selected-item-info" id="inv-item-info">선택된 아이템이 없습니다.</div>
          <button id="btn-sell-to-shipping" class="btn-cozy-primary">출하 상자에 넣기</button>
        </div>
      </div>
    </div>

    <!-- ================= MODAL: FISHING MINI-GAME ================= -->
    <div id="modal-fishing" class="center-dialog-modal hidden">
      <div class="modal-backdrop"></div>
      <div class="fishing-game-card">
        <div class="fishing-header">
          <h3>🎣 물고기를 낚아 올리세요!</h3>
          <p>화면을 길게 눌러 초록색 바를 물고기 위치에 유지하세요!</p>
        </div>

        <div class="fishing-gauge-container">
          <div class="fishing-water-column">
            <div class="green-catch-bar" id="fish-green-bar"></div>
            <div class="swimming-fish-icon" id="fish-icon">🐟</div>
          </div>
          <div class="fishing-catch-progress-track">
            <div class="fishing-catch-fill" id="fish-progress-fill" style="height: 30%;"></div>
          </div>
        </div>

        <button id="btn-reel-fish" class="btn-reel-touch">릴 감기 (TAP & HOLD)</button>
      </div>
    </div>

    <!-- ================= MODAL: DAILY SHIPPING REVENUE SUMMARY ================= -->
    <div id="modal-shipping-summary" class="center-dialog-modal hidden">
      <div class="modal-backdrop"></div>
      <div class="shipping-summary-card">
        <div class="summary-sun-icon">🌅</div>
        <h2>오늘의 농장 출하 정산</h2>
        <div class="summary-rows-list" id="summary-items-list"></div>
        <div class="summary-total-row">
          <span>총 수익 (Total Earned):</span>
          <strong class="money-gold" id="summary-total-gold">+0 G</strong>
        </div>
        <button id="btn-start-next-day" class="btn-cozy-primary">새로운 하루 시작하기</button>
      </div>
    </div>

    <!-- Interactive Floating Notice Tooltip -->
    <div id="game-toast" class="toast-hidden">알림 내용</div>

  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/crops.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
